<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartTeam — Планировщик задач</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f7fb;
    color: #182033;
    min-height: 100vh;
}

/* HEADER */
header {
    height: 72px;
    background: #ffffff;
    border-bottom: 1px solid #e8ebf2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 800;
}

.logo-icon {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: #3867ff;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
}

.logo span {
    color: #3867ff;
}

.header-right {
    color: #697386;
    font-size: 14px;
}

/* LAYOUT */
.container {
    width: 90%;
    max-width: 1250px;
    margin: 35px auto;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
}

.title h1 {
    font-size: 32px;
    margin-bottom: 7px;
}

.title p {
    color: #70798b;
}

/* BUTTON */
.add-btn {
    background: #3867ff;
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

.add-btn:hover {
    background: #2853dc;
    transform: translateY(-2px);
}

/* STATS */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}

.stat {
    background: white;
    border: 1px solid #e8ebf2;
    border-radius: 17px;
    padding: 21px;
}

.stat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: #eef2ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
}

.stat h3 {
    font-size: 27px;
    margin-top: 13px;
}

.stat p {
    color: #7b8495;
    margin-top: 4px;
    font-size: 14px;
}

/* CONTENT */
.content {
    background: white;
    border: 1px solid #e8ebf2;
    border-radius: 20px;
    overflow: hidden;
}

/* TOOLBAR */
.toolbar {
    padding: 18px;
    display: flex;
    gap: 12px;
    border-bottom: 1px solid #edf0f5;
}

.search {
    flex: 1;
    position: relative;
}

.search input {
    width: 100%;
    border: 1px solid #dfe4ed;
    border-radius: 11px;
    padding: 12px 15px 12px 40px;
    outline: none;
    font-size: 14px;
}

.search input:focus {
    border-color: #3867ff;
}

.search-icon {
    position: absolute;
    left: 14px;
    top: 11px;
    color: #8992a3;
}

select {
    border: 1px solid #dfe4ed;
    border-radius: 11px;
    padding: 0 13px;
    background: white;
    color: #424b5d;
    outline: none;
    cursor: pointer;
}

/* TASKS */
.tasks {
    padding: 5px 18px 18px;
}

.task {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 5px;
    border-bottom: 1px solid #edf0f5;
}

.task:last-child {
    border-bottom: none;
}

.check {
    width: 22px;
    height: 22px;
    border: 2px solid #cbd2df;
    border-radius: 7px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 13px;
}

.check:hover {
    border-color: #3867ff;
}

.task.completed .check {
    background: #3867ff;
    border-color: #3867ff;
}

.task-info {
    flex: 1;
    min-width: 0;
}

.task-name {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 7px;
}

.task.completed .task-name {
    text-decoration: line-through;
    color: #9ba3b1;
}

.task-details {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}

.category {
    background: #eef2ff;
    color: #3867ff;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.date {
    color: #7c8493;
    font-size: 12px;
}

.priority {
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.priority.high {
    background: #fff0f0;
    color: #e5484d;
}

.priority.medium {
    background: #fff8e7;
    color: #c48600;
}

.priority.low {
    background: #eefbf3;
    color: #29965b;
}

.delete {
    border: none;
    background: transparent;
    color: #a0a7b4;
    font-size: 18px;
    cursor: pointer;
    padding: 7px;
}

.delete:hover {
    color: #e5484d;
}

/* EMPTY */
.empty {
    text-align: center;
    padding: 55px 20px;
    color: #8a93a3;
}

.empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
}

.empty h3 {
    color: #4d5668;
    margin-bottom: 7px;
}

/* MODAL */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .48);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    z-index: 10;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    background: white;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
}

.modal-header h2 {
    font-size: 23px;
}

.close {
    border: none;
    background: #f1f3f7;
    width: 35px;
    height: 35px;
    border-radius: 9px;
    cursor: pointer;
    font-size: 18px;
}

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 45px;
    border: 1px solid #dfe4ed;
    border-radius: 10px;
    padding: 0 13px;
    font-size: 14px;
    background: white;
}

.form-group input:focus,
.form-group select:focus {
    outline: none;
    border-color: #3867ff;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.save-btn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 11px;
    background: #3867ff;
    color: white;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    margin-top: 5px;
}

.save-btn:hover {
    background: #2853dc;
}

/* MOBILE */
@media (max-width: 800px) {

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .top {
        align-items: flex-start;
        gap: 15px;
    }

    .title h1 {
        font-size: 27px;
    }

    .toolbar {
        flex-direction: column;
    }

    select {
        height: 44px;
    }
}

@media (max-width: 520px) {

    header {
        padding: 0 4%;
    }

    .header-right {
        display: none;
    }

    .container {
        width: 94%;
        margin: 25px auto;
    }

    .top {
        flex-direction: column;
    }

    .add-btn {
        width: 100%;
    }

    .stats {
        gap: 10px;
    }

    .stat {
        padding: 15px;
    }

    .stat h3 {
        font-size: 23px;
    }

    .task {
        gap: 10px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 0;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <div class="logo-icon">S</div>
        Smart<span>Team</span>
    </div>

    <div class="header-right">
        Планировщик студентов
    </div>
</header>


<main class="container">

    <!-- TITLE -->
    <div class="top">

        <div class="title">
            <h1>Мои задачи</h1>
            <p>Планируй учёбу и успевай больше</p>
        </div>

        <button class="add-btn" onclick="openModal()">
            + Добавить задачу
        </button>

    </div>


    <!-- STATISTICS -->
    <div class="stats">

        <div class="stat">
            <div class="stat-top">
                <div>
                    <h3 id="allCount">0</h3>
                    <p>Всего задач</p>
                </div>

                <div class="stat-icon">📋</div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div>
                    <h3 id="todayCount">0</h3>
                    <p>На сегодня</p>
                </div>

                <div class="stat-icon">📅</div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div>
                    <h3 id="doneCount">0</h3>
                    <p>Выполнено</p>
                </div>

                <div class="stat-icon">✓</div>
            </div>
        </div>

        <div class="stat">
            <div class="stat-top">
                <div>
                    <h3 id="importantCount">0</h3>
                    <p>Важные</p>
                </div>

                <div class="stat-icon">🔥</div>
            </div>
        </div>

    </div>


    <!-- TASK CONTENT -->
    <div class="content">

        <div class="toolbar">

            <div class="search">
                <span class="search-icon">⌕</span>

                <input
                    type="text"
                    id="search"
                    placeholder="Поиск задач..."
                    oninput="renderTasks()">
            </div>

            <select id="filter" onchange="renderTasks()">
                <option value="all">Все задачи</option>
                <option value="today">Сегодня</option>
                <option value="active">Активные</option>
                <option value="completed">Выполненные</option>
            </select>

            <select id="categoryFilter" onchange="renderTasks()">
                <option value="all">Все категории</option>
                <option value="Учёба">Учёба</option>
                <option value="Экзамен">Экзамен</option>
                <option value="Проект">Проект</option>
                <option value="Личное">Личное</option>
            </select>

        </div>


        <div class="tasks" id="tasks"></div>

    </div>

</main>


<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-header">
            <h2>Новая задача</h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>
        </div>


        <div class="form-group">
            <label>Название задачи</label>

            <input
                type="text"
                id="taskName"
                placeholder="Например: Подготовиться к экзамену">
        </div>


        <div class="form-row">

            <div class="form-group">
                <label>Дата выполнения</label>

                <input
                    type="date"
                    id="taskDate">
            </div>


            <div class="form-group">
                <label>Приоритет</label>

                <select id="taskPriority">

                    <option value="high">
                        Высокий
                    </option>

                    <option value="medium" selected>
                        Средний
                    </option>

                    <option value="low">
                        Низкий
                    </option>

                </select>
            </div>

        </div>


        <div class="form-group">

            <label>Категория</label>

            <select id="taskCategory">

                <option value="Учёба">
                    Учёба
                </option>

                <option value="Экзамен">
                    Экзамен
                </option>

                <option value="Проект">
                    Проект
                </option>

                <option value="Личное">
                    Личное
                </option>

            </select>

        </div>


        <button class="save-btn" onclick="addTask()">
            Добавить задачу
        </button>

    </div>

</div>


<script>

/* =========================
   ДАННЫЕ
========================= */

let tasks = JSON.parse(
    localStorage.getItem("smartTeamTasks")
) || [];


/* =========================
   МОДАЛЬНОЕ ОКНО
========================= */

function openModal() {

    document.getElementById("modal")
        .classList.add("show");

    document.getElementById("taskName")
        .focus();
}


function closeModal() {

    document.getElementById("modal")
        .classList.remove("show");

    document.getElementById("taskName").value = "";

    document.getElementById("taskDate").value = "";

    document.getElementById("taskPriority").value = "medium";

    document.getElementById("taskCategory").value = "Учёба";
}


/* Закрытие при клике вне окна */

document.getElementById("modal").addEventListener(
    "click",
    function(event) {

        if (event.target === this) {
            closeModal();
        }

    }
);


/* =========================
   ДОБАВЛЕНИЕ
========================= */

function addTask() {

    const name =
        document.getElementById("taskName").value.trim();

    const date =
        document.getElementById("taskDate").value;

    const priority =
        document.getElementById("taskPriority").value;

    const category =
        document.getElementById("taskCategory").value;


    if (!name) {

        alert("Введите название задачи!");

        return;
    }


    const task = {

        id: Date.now(),

        name: name,

        date: date,

        priority: priority,

        category: category,

        completed: false

    };


    tasks.unshift(task);

    saveTasks();

    closeModal();

    renderTasks();
}


/* =========================
   СОХРАНЕНИЕ
========================= */

function saveTasks() {

    localStorage.setItem(
        "smartTeamTasks",
        JSON.stringify(tasks)
    );
}


/* =========================
   ВЫПОЛНЕНИЕ
========================= */

function toggleTask(id) {

    tasks = tasks.map(task => {

        if (task.id === id) {

            task.completed = !task.completed;

        }

        return task;

    });


    saveTasks();

    renderTasks();
}


/* =========================
   УДАЛЕНИЕ
========================= */

function deleteTask(id) {

    tasks = tasks.filter(
        task => task.id !== id
    );

    saveTasks();

    renderTasks();
}


/* =========================
   ФОРМАТ ДАТЫ
========================= */

function formatDate(date) {

    if (!date) {
        return "Без дедлайна";
    }

    const parts = date.split("-");

    return parts[2] + "." +
           parts[1] + "." +
           parts[0];
}


/* =========================
   СЕГОДНЯ
========================= */

function isToday(date) {

    if (!date) return false;

    const today = new Date();

    const todayString =
        today.getFullYear() + "-" +
        String(today.getMonth() + 1).padStart(2, "0") + "-" +
        String(today.getDate()).padStart(2, "0");

    return date === todayString;
}


/* =========================
   ПРИОРИТЕТ
========================= */

function priorityText(priority) {

    if (priority === "high")
        return "Высокий";

    if (priority === "medium")
        return "Средний";

    return "Низкий";
}


/* =========================
   ОТОБРАЖЕНИЕ
========================= */

function renderTasks() {

    const container =
        document.getElementById("tasks");

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const filter =
        document.getElementById("filter")
        .value;

    const category =
        document.getElementById("categoryFilter")
        .value;


    let filtered = tasks.filter(task => {

        const matchesSearch =
            task.name
                .toLowerCase()
                .includes(search);


        const matchesCategory =
            category === "all" ||
            task.category === category;


        let matchesFilter = true;


        if (filter === "today") {

            matchesFilter =
                isToday(task.date);

        }

        if (filter === "active") {

            matchesFilter =
                !task.completed;

        }

        if (filter === "completed") {

            matchesFilter =
                task.completed;

        }


        return matchesSearch &&
               matchesCategory &&
               matchesFilter;

    });


    /* Пустой список */

    if (filtered.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">📚</div>
                <h3>Задач пока нет</h3>
                <p>Добавь первую задачу, чтобы начать планирование.</p>
            </div>
        `;

        updateStats();

        return;
    }


    /* Задачи */

    container.innerHTML = filtered.map(task => {

        return `

            <div class="task ${
                task.completed ? "completed" : ""
            }">

                <div
                    class="check"
                    onclick="toggleTask(${task.id})">

                    ${task.completed ? "✓" : ""}

                </div>


                <div class="task-info">

                    <div class="task-name">
                        ${escapeHTML(task.name)}
                    </div>


                    <div class="task-details">

                        <span class="category">
                            ${task.category}
                        </span>


                        <span class="priority ${task.priority}">
                            ${priorityText(task.priority)}
                        </span>


                        <span class="date">
                            📅 ${formatDate(task.date)}
                        </span>

                    </div>

                </div>


                <button
                    class="delete"
                    onclick="deleteTask(${task.id})"
                    title="Удалить">

                    🗑

                </button>

            </div>

        `;

    }).join("");


    updateStats();
}


/* =========================
   СТАТИСТИКА
========================= */

function updateStats() {

    const all =
        tasks.length;

    const today =
        tasks.filter(task =>
            isToday(task.date)
        ).length;

    const done =
        tasks.filter(task =>
            task.completed
        ).length;

    const important =
        tasks.filter(task =>
            task.priority === "high" &&
            !task.completed
        ).length;


    document.getElementById("allCount")
        .textContent = all;

    document.getElementById("todayCount")
        .textContent = today;

    document.getElementById("doneCount")
        .textContent = done;

    document.getElementById("importantCount")
        .textContent = important;
}


/* =========================
   ЗАЩИТА HTML
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =========================
   ENTER ДЛЯ ДОБАВЛЕНИЯ
========================= */

document.getElementById("taskName")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        }
    );


/* =========================
   ЗАПУСК
========================= */

renderTasks();

</script>

</body>
</html>
